<!-- Adapted (and revised according to personal project architecture) from CSE 135 Tutorial Site: `login.html` -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Wrecked Tech Analytics Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: 
            border-box; 
        }
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #F5F0E8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #FDFAF5;
            border-radius: 8px;
            border: 1px solid #E8DDD0;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            margin: 20px;
            position: relative;
            overflow: hidden;
        }
        .brand-bar {
            width: 100%;
            height: 4px;
            background: #3D3458;
            border-radius: 8px 8px 0 0;
            position: absolute;
            top: 0;
            left: 0;
        }
        .login-card h1 {
            font-size: 1.4em;
            color: #2C2440;
            text-align: center;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .login-card .subtitle {
            text-align: center;
            color: #A89880;
            font-size: 0.9em;
            margin-bottom: 30px;
        }
        .form-group { 
            margin-bottom: 20px; 
        }
        .form-group label {
            display: block;
            font-size: 0.85em;
            font-weight: 600;
            color: #7A6E65;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #E8DDD0;
            border-radius: 4px;
            font-size: 1em;
            font-family: inherit;
            background: #FDFAF5;
            color: #2C2440;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #C1622F;
            box-shadow: 0 0 0 3px rgba(193,98,47,0.12);
        }
        .error {
            background: #FAECE7;
            color: #7A3D1A;
            border: 1px solid #F0C4B0;
            border-radius: 4px;
            padding: 10px 12px;
            font-size: 0.9em;
            margin-bottom: 20px;
        }
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #C1622F;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }
        button[type="submit"]:hover { background: #A0511F; }
        button[type="submit"]:active { background: #7A3D1A; }
        button[type="submit"]:disabled { background: #E8C4B0; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-bar"></div>
        <form id="login-form">
            <h1>Wrecked Tech Analytics Dashboard</h1>
            <p class="subtitle">Sign in to view Wrecked Tech's dashboard reports</p>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       placeholder="you@example.com"
                       required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Enter your password"
                       required autocomplete="current-password">
            </div>

            <div id="error-message" class="error" hidden></div>

            <button type="submit">Sign In</button>
        </form>
    </div>

    <script>
    (function() {
        'use strict';

        const form = document.getElementById('login-form');
        const errorDiv = document.getElementById('error-message');
        const submitBtn = form.querySelector('button[type="submit"]');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.hidden = true;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    window.location.href = data.redirect || '../dashboard';
                } else {
                    errorDiv.textContent = data.error || 'Invalid email or password.';
                    errorDiv.hidden = false;
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                }
            } catch (err) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.hidden = false;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });
    })();
    </script>
</body>
</html>
