<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden</title>
    <link rel="stylesheet" href="/shared.css">
    <style>
        body { 
            display: flex; 
            align-items: 
            center; 
            justify-content: center; 
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-code">403</div>
        <div class="error-title">Access Denied</div>
        <div class="error-desc">
            You don't have permission to view this page. This area may be restricted to a different role than yours. If you believe this is a mistake, contact your administrator.
        </div>
        <div class="error-actions">
            <a href="/dashboard" class="btn-home">Go to Dashboard</a>
            <a href="javascript:history.back()" class="btn-back">Go Back</a>
        </div>
    </div>
</body>
</html>
